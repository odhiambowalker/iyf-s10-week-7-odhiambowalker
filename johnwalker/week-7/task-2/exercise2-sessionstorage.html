<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Storage Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 1rem;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 0.25rem;
    }

    p {
      margin-top: 0;
      color: #444;
    }

    small {
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Session Storage Demo</h1>
  <p>Type in the box below and refresh the page. The text is preserved for this browser session only.</p>
  <textarea id="msg" placeholder="Type something here..."></textarea>
  <p><small>sessionStorage key: <code>text</code></small></p>

  <script>
    const msg = document.getElementById("msg");

    msg.value = sessionStorage.getItem("text") || "";

    msg.addEventListener("input", () => {
      sessionStorage.setItem("text", msg.value);
    });
  </script>
</body>
</html>
